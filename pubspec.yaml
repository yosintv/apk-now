name: YoSinTV
description: YoSinTV - Live Sports Streaming Application.
version: 1.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.0
  better_player_plus: ^1.3.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.0
  intl: ^0.20.2
  google_mobile_ads: ^8.0.0
  wakelock_plus: ^1.6.1
  package_info_plus: ^10.1.0
  connectivity_plus: ^6.1.0
  firebase_core: ^3.10.1
  firebase_analytics: ^11.4.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
