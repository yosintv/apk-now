name: iOS Build for Testing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install --repo-update
      
      - name: Build iOS (Release - No Codesign)
        run: flutter build ios --release --no-codesign -v
      
      - name: Check build output directory
        run: ls -la ios/build/Release-iphoneos/ || echo "Build directory not found"
      
      - name: Create IPA without Codesign
        if: success()
        run: |
          cd ios/build/Release-iphoneos
          mkdir -p Payload
          cp -r YoSinTV.app Payload/
          zip -r YoSinTV.ipa Payload/
          ls -lh YoSinTV.ipa
      
      - name: Upload IPA as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YoSinTV-iOS-IPA
          path: ios/build/Release-iphoneos/YoSinTV.ipa
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: ios/build/Release-iphoneos/YoSinTV.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
